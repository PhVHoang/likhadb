apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: likhadb
  labels:
    app.kubernetes.io/environment: staging
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: likhadb
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-image
          vars:
            - name: overlayPath
              value: deploy/overlays/staging
            - name: environmentPath
              value: environments/staging
            - name: argoCDApp
              value: likhadb-staging

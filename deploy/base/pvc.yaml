apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: likhadb-data
  annotations:
    # Persistent data must never disappear through an unattended Argo CD prune.
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi


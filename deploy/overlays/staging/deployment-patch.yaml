apiVersion: apps/v1
kind: Deployment
metadata:
  name: likhadb
spec:
  template:
    spec:
      containers:
        - name: likhadb
          env:
            - name: LIKHADB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: likhadb-secrets
                  key: api-token
                  optional: false
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi

